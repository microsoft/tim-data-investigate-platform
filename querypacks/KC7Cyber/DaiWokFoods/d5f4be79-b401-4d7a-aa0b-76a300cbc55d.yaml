name: User Timeline
queryType: query
menu: Show timeline of user activity
summary: User timeline for {{username}}
path:
  - User
cluster: https://kc7001.eastus.kusto.windows.net/
database: DaiWokFoods
columnId: EventId
params: null
fields:
  username:
    type: string
    from: null
    regex: null
  timestamp:
    type: datetime
    from: null
    regex: null
columns:
  default:
    hide: true
  timestamp:
    hide: false
  PivotTimeDiff:
    hide: false
  EventSource:
    hide: false
  hostname:
    hide: false
  EventSummary:
    hide: false
    flex: 1
  username:
    hide: false
query: "{{> getTagEvents}}\r\n\r\nlet _username = \"{{username}}\";\r\nlet _timestamp = datetime({{timestamp}});\r\n\r\nlet _email_alias = \r\ntoscalar(Employees\r\n| where username has _username\r\n| take 1\r\n| project email_addr);\r\nlet UserProcessEvents = ProcessEvents\r\n| where username has _username\r\n| extend EventId = hash_sha256(strcat(parent_process_name, process_commandline, process_commandline, hostname, username, timestamp))\r\n| extend EventSummary = strcat(\"Parent process \", parent_process_name, \" created child process \", process_name, \" with commandline '\", process_commandline, \"'\")\r\n| extend EventSource = \"ProcessEvents\";\r\nlet UserFileEvents = FileCreationEvents\r\n| where username has _username\r\n| extend EventId = hash_sha256(strcat(path,filename,process_name, username, timestamp))\r\n| extend EventSummary = strcat(\"The process \", process_name,\" created the file \", path, \" under the account \", username)\r\n| extend EventSource = \"FileCreationEvents\";\r\nlet UserAuthenticationEvents = AuthenticationEvents\r\n| where username has _username\r\n| extend EventId = hash_sha256(strcat(timestamp, hostname, src_ip, user_agent, username, result, password_hash))\r\n| extend EventSummary = strcat(\"The user \", username, \" authenticated to \", hostname, \" with useragent: \",user_agent)\r\n| extend EventSource = \"AuthenticationEvents\"\r\n| extend IpAddr = src_ip;\r\nlet UserEmail = Email\r\n| where sender has _email_alias or recipient has _email_alias\r\n| extend EventId = hash_sha256(strcat(timestamp,sender,reply_to,subject,recipient,verdict,link))\r\n| extend EventSummary = strcat(\"The sender \",sender, \" sent email with subject '\",subject,\"' to recipient \",recipient,\". Verdict was \",verdict,\" on link: \",link)\r\n| extend EventSource = \"Email\"\r\n| extend RemoteUrl = link;\r\nlet UserEmployees = Employees\r\n| where username has _username\r\n| extend EventId = hash_sha256(strcat(timestamp,name,user_agent,ip_addr,email_addr,company_domain,username,role,hostname))\r\n| extend EventSummary = strcat(\"User \",username, \" was recorded with role: \",role, \", host: \", hostname, \" email : \", email_addr, \" and company : \",company_domain)\r\n| extend EventSource = \"Employees\"\r\n| extend IpAddr = ip_addr;\r\nlet UserSecurityAlerts = SecurityAlerts\r\n| extend EventId = hash_sha256(description)\r\n| extend hostname = extract(\"[A-Z0-9]{4}-(DESKTOP|MACHINE|LAPTOP)\",0,description)\r\n| extend username = iif(alert_type has \"EMAIL\", extract(\"Employee ([a-z]+) reported\", 1, description), \"\")\r\n| where username has _username\r\n| extend EventSummary = description\r\n| extend EventSource = \"SecurityAlerts\";\r\nunion UserFileEvents, UserProcessEvents, UserEmail, UserEmployees, UserSecurityAlerts, UserAuthenticationEvents\r\n| project-reorder timestamp, EventSource, EventSummary, hostname, username\r\n| extend EventTime = timestamp\r\n| extend TimeDiff=datetime_diff('Millisecond', timestamp, _timestamp)/1000.0\r\n| extend PivotTimeDiff=TimeDiff * 1000 * 1ms\r\n| invoke getTagEvents()\r\n| sort by timestamp asc"
