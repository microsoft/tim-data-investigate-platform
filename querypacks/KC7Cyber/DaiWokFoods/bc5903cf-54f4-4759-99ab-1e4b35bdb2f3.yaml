name: Created process filename/hash timeline
queryType: query
menu: Show events related to created process file name and hash
summary: >-
  Events related to process filename {{process_name}} and filehash
  {{process_hash}}
path:
  - File
cluster: https://kc7001.eastus.kusto.windows.net/
database: DaiWokFoods
columnId: EventId
params:
  periodBefore:
    default: 30d
    type: string
    optional: null
    multiple: null
    hint: null
    values: null
  periodAfter:
    default: 30d
    type: string
    optional: null
    multiple: null
    hint: null
    values: null
fields:
  process_name:
    type: string
    from: null
    regex: null
  process_hash:
    type: string
    from: null
    regex: null
  timestamp:
    type: datetime
    from: null
    regex: null
columns:
  default:
    hide: true
  timestamp:
    hide: false
  PivotTimeDiff:
    hide: false
  hostname:
    hide: false
  EventSource:
    hide: false
  EventSummary:
    hide: false
    flex: 1
  username:
    hide: false
query: "{{> getTagEvents}}\r\n\r\nlet _filename = \"{{process_name}}\";\r\nlet _sha256 = \"{{process_hash}}\";\r\nlet _timestamp = datetime({{timestamp}});\r\nlet _periodBefore = totimespan({{periodBefore}});\r\nlet _periodAfter = totimespan({{periodAfter}});\r\nlet HostProcessEvents = ProcessEvents\r\n| where timestamp between ((_timestamp-_periodBefore) .. (_timestamp+_periodAfter))\r\n| where parent_process_hash =~ _sha256 or\r\n  process_hash =~ _sha256 or\r\n  process_commandline has _filename or\r\n  parent_process_name has _filename\r\n| extend EventId = hash_sha256(strcat(parent_process_name, process_commandline, process_commandline, hostname, username, timestamp))\r\n| extend EventSummary = strcat(\"Parent process \", parent_process_name, \" created child process \", process_name, \" with commandline '\", process_commandline, \"'\")\r\n| extend EventSource = \"ProcessEvents\";\r\nlet HostFileEvents = FileCreationEvents\r\n| where timestamp between ((_timestamp-_periodBefore) .. (_timestamp+_periodAfter))\r\n| where sha256 =~ _sha256 or\r\n  process_name has _filename or\r\n  path has _filename\r\n| extend EventId = hash_sha256(strcat(path,filename,process_name, username, timestamp))\r\n| extend EventSummary = strcat(\"The process \", process_name,\" created the file \", path, \" under the account \", username)\r\n| extend EventSource = \"FileCreationEvents\";\r\nlet HostSecurityAlerts = SecurityAlerts\r\n| where timestamp between ((_timestamp-_periodBefore) .. (_timestamp+_periodAfter))\r\n| where description has _filename or\r\n  description has _sha256\r\n| extend EventId = hash_sha256(description)\r\n| extend hostname = extract(\"[A-Z0-9]{4}-(DESKTOP|MACHINE|LAPTOP)\",0,description)\r\n| extend username = iif(alert_type has \"EMAIL\", extract(\"Employee ([a-z]+) reported\", 1, description), \"\")\r\n| extend EventSummary = description\r\n| extend EventSource = \"SecurityAlerts\";\r\nlet OutboundNetwork = OutboundNetworkEvents\r\n| where url has _filename\r\n| extend EventId = hash_sha256(strcat(timestamp,method,src_ip,user_agent,url))\r\n| extend EventSummary = strcat(\"The host with source IP \", src_ip, \" connected (outbound) to URL: \",url)\r\n| extend EventSource = \"OutboundNetworkEvents\"\r\n| extend RemoteUrl = url\r\n| extend IpAddr = src_ip;\r\nlet EmailEvents = Email\r\n| where timestamp between ((_timestamp-_periodBefore) .. (_timestamp+_periodAfter))\r\n| where link has _filename\r\n| extend EventId = hash_sha256(strcat(timestamp,sender,reply_to,subject,recipient,verdict,link))\r\n| extend EventSummary = strcat(\"The sender \",sender, \" sent email with subject '\",subject,\"' to recipient \",recipient,\". Verdict was \",verdict,\" on link: \",link)\r\n| extend EventSource = \"Email\"\r\n| extend EventTime = timestamp\r\n| extend RemoteUrl = link;\r\nunion HostProcessEvents, HostFileEvents, HostSecurityAlerts, OutboundNetwork, EmailEvents\r\n| project-reorder timestamp, EventSource, EventSummary\r\n| extend EventTime = timestamp\r\n| extend TimeDiff=datetime_diff('Millisecond', timestamp, _timestamp)/1000.0\r\n| extend PivotTimeDiff=TimeDiff * 1000 * 1ms\r\n| invoke getTagEvents()\r\n| sort by timestamp asc"
